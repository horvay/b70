<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B70 queue</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%235fb3ff%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div class="brand">B70 <span>queue</span></div>
    <div id="pill" class="pill">…</div>
    <div id="pausePill" class="pill paused" hidden title="the job on the card finishes; nothing new starts until the queue is resumed">PAUSED</div>
    <div id="statusText" class="statusText"></div>
    <div class="kpis" id="kpis"></div>
    <div class="actions"><button id="historyBtn">History</button><button id="pauseBtn"></button></div>
  </header>
  <main>
    <div class="pair">
      <section class="card now" id="now"><h2>Now</h2><div class="body"></div></section>
      <section class="card queue" id="queue"><h2>Queue</h2><div class="body"></div></section>
    </div>
    <section class="card standby" id="standby" hidden><h2>Standby model</h2><div class="body"></div></section>
    <section class="card live">
      <h2>Live <span class="seg" id="range"><button data-min="15" class="on">15 min</button><button data-min="60">1 h</button></span></h2>
      <div class="charts">
        <div><h3>VRAM <small>GiB · card / current job</small></h3><div id="chVram"></div></div>
        <div><h3>Power <small>W</small></h3><div id="chPower"></div></div>
        <div><h3>GPU busy <small>%</small></h3><div id="chUtil"></div></div>
        <div><h3>Temperature <small>°C · GPU / VRAM</small></h3><div id="chTemp"></div></div>
      </div>
    </section>
    <section class="card alerts" id="alerts" hidden><h2>Alerts</h2><div class="body"></div></section>
    <section class="card log" id="log"><h2>Log <small id="logWhat"></small></h2><pre id="logText"></pre></section>
  </main>
  <dialog id="past">
    <h2><span class="seg" id="pastTabs"><button data-tab="history" class="on">History</button><button data-tab="stats">Job types</button></span>
      <small id="pastNote"></small><button class="small close" id="pastClose" title="close (Esc)">✕</button></h2>
    <div id="history"><div class="body"></div></div>
    <div id="stats" hidden><div class="body"></div></div>
  </dialog>
  <script type="module" src="./app.ts"></script>
</body>
</html>
