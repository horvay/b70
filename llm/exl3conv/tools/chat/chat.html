<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1c1f25; --line:#2c3038; --fg:#e6e8eb; --dim:#8b919a; --user:#25324a; --acc:#6ea8fe; --warn:#e8b04a; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  aside { width:270px; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--line); flex:none; min-height:0; }
  aside .top { padding:12px; display:flex; gap:6px; }
  #chats { flex:1; overflow:auto; padding:0 8px; min-height:80px; }
  .chat { display:flex; align-items:center; gap:4px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .chat:hover { background:#242830; } .chat.on { background:#2a3040; }
  .chat span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat i { font-style:normal; color:var(--dim); visibility:hidden; padding:0 3px; } .chat:hover i { visibility:visible; } .chat i:hover { color:var(--fg); }
  #settings { padding:10px 12px 14px; border-top:1px solid var(--line); overflow:auto; max-height:56vh; }
  #settings label { display:block; margin:9px 0 3px; color:var(--dim); font-size:12px; }
  #settings input, #settings textarea, #settings select { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  #settings textarea { height:90px; resize:vertical; }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow:auto; padding:18px 6vw; }
  .msg { margin:0 0 18px; max-width:920px; }
  .head { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px; margin-bottom:2px; min-height:22px; }
  .head .sp { flex:1; }
  .acts { display:none; gap:2px; flex-wrap:wrap; } .msg:hover .acts, .msg.editing .acts { display:flex; }
  .acts button, .vers button { background:none; border:1px solid transparent; color:var(--dim); border-radius:5px; padding:1px 7px; font:inherit; font-size:12px; cursor:pointer; }
  .acts button:hover, .vers button:hover { color:var(--fg); border-color:var(--line); background:#242830; }
  .acts button.del:hover { color:#ff8a80; }
  .vers { display:inline-flex; align-items:center; gap:2px; }
  .body { white-space:pre-wrap; word-wrap:break-word; }
  .msg.user .body { background:var(--user); padding:8px 12px; border-radius:10px; display:inline-block; max-width:100%; }
  .body em { color:#c9d4e6; } .body code { background:#242830; border-radius:4px; padding:0 4px; }
  details { margin:0 0 6px; color:var(--dim); font-size:13px; }
  details summary { cursor:pointer; }
  details pre { white-space:pre-wrap; margin:6px 0 0; font:inherit; border-left:2px solid var(--line); padding-left:10px; }
  .tag { color:var(--warn); font-size:12px; }
  .err { color:#ff8a80; margin-top:4px; }
  .edit textarea { width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--acc); border-radius:8px; padding:8px 10px; font:inherit; resize:vertical; display:block; margin-bottom:6px; min-height:60px; }
  .edit .lab { color:var(--dim); font-size:12px; margin:2px 0; }
  .edit .btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
  .insert { height:10px; margin:-14px 0 4px; opacity:0; text-align:center; font-size:12px; color:var(--dim); } .insert:hover { opacity:1; }
  .insert button { background:none; border:0; color:var(--dim); cursor:pointer; font-size:12px; } .insert button:hover { color:var(--fg); }
  form { display:flex; gap:8px; padding:12px 6vw 8px; border-top:1px solid var(--line); }
  #in { flex:1; height:64px; resize:vertical; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  button.b { background:var(--acc); color:#0b1220; border:0; border-radius:8px; padding:5px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.b.alt { background:var(--line); color:var(--fg); font-weight:400; }
  button.b.sm { padding:3px 10px; font-size:13px; }
  #stat { padding:0 6vw 10px; color:var(--dim); font-size:12px; min-height:20px; }
</style>
</head>
<body>
<aside>
  <div class="top"><button class="b" id="new" style="flex:1">New chat</button><button class="b alt" id="undo" title="Undo the last delete or edit">Undo</button></div>
  <div id="chats"></div>
  <div id="settings">
    <b>Settings</b>
    <label>System prompt (this chat)</label><textarea id="sys"></textarea>
    <div class="row">
      <div><label>Temperature</label><input id="temp" type="number" step="0.05" min="0" max="2"></div>
      <div><label>min_p</label><input id="minp" type="number" step="0.01" min="0" max="1"></div>
    </div>
    <div class="row">
      <div><label>top_p</label><input id="topp" type="number" step="0.05" min="0" max="1"></div>
      <div><label>Max new tokens</label><input id="maxt" type="number" step="256" min="16"></div>
    </div>
    <div class="row">
      <div><label>Thinking</label><select id="think"><option value="on">on</option><option value="off">off</option></select></div>
      <div><label>Effort</label><select id="effort"><option value="xhigh">xhigh</option><option value="medium">medium</option><option value="low">low</option></select></div>
    </div>
    <label>Model</label><input id="model" placeholder="(first model on the server)">
    <div class="row" style="margin-top:12px">
      <button class="b alt sm" id="export">Export chat</button><button class="b alt sm" id="import">Import</button>
    </div>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</aside>
<main>
  <div id="log"></div>
  <form id="f">
    <textarea id="in" placeholder="Message (Enter sends, Shift+Enter for a new line)" autofocus></textarea>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="b" id="send" type="submit">Send</button>
      <button class="b alt" id="stop" type="button" hidden>Stop</button>
    </div>
  </form>
  <div id="stat"></div>
</main>
<script src="/prompt.js"></script>
<script src="/chat.js"></script>
</body>
</html>
