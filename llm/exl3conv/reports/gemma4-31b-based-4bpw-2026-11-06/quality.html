</style></head><body><figure aria-labelledby="title"><div class="pill">Gemma 4 31B-based · EXL3 4 bpw · scaled Hessians</div><h3 id="title">Top-token agreement with the BF16 original</h3><p>Higher means the quantized model more often chooses the original's highest-scoring token.</p><div class="chart" role="img" aria-label="Held-out chat: 97.35 percent agreement, 95 percent interval 96.57 to 98.08. Broader chat: 74.49 percent, interval 73.14 to 75.93."><div class="row"><div class="label"><span>Held-out chat trace</span><strong>97.35%</strong></div><div class="track"><div class="bar" style="width:97.35%"></div><span class="interval" style="left:96.57%;width:1.51%"></span></div><div class="detail">13,835 tokens · 10 conversations · 95% CI 96.57–98.08%</div></div><div class="row chat"><div class="label"><span>Broader chat conversations</span><strong>74.49%</strong></div><div class="track"><div class="bar" style="width:74.49%"></div><span class="interval" style="left:73.14%;width:2.79%"></span></div><div class="detail">101,700 tokens · 199 conversations · 95% CI 73.14–75.93%</div></div><div class="axis"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div></div><p class="foot">Roleplay perplexity: BF16 1.207, quant 1.217. Chat perplexity: BF16 753.199, quant 815.346.<br>The chat trace comes from Gemma 4 31B-based. These checks measure quantization fidelity, not the quality of a played the client session.</p></figure></body></html>
